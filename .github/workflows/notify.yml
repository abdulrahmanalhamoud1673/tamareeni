name: تنبيهات تماريني

# بيشتغل كل ١٠ دقايق. كرون GitHub ما بيضبط بالدقيقة (بيتأخّر)، عشان هيك
# notify.js بيشتغل بنوافذ وبيتذكّر شو بعت بـ push/state.json فما يكرّر.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: tamareeni-notify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # ابدأ من آخر حالة، مش من لقطة قديمة
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --no-save web-push@3
      - name: افحص وابعث
        run: node push/notify.js
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_STORE: ${{ secrets.PUSH_STORE }}
          PUSH_DEVICES: ${{ secrets.PUSH_DEVICES }}
      - name: احفظ شو انبعث
        run: |
          if [ -n "$(git status --porcelain push/state.json)" ]; then
            git config user.name "tamareeni-bot"
            git config user.email "tamareeni-bot@users.noreply.github.com"
            git add push/state.json
            git commit -q -m "تنبيهات: تذكّر شو انبعث"
            git pull -q --rebase -X theirs && git push -q
          fi
