<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تماريني</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تماريني">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#ffffff; --tx:#111111; --mut:#8c8c8c; --line:#e6e6e6; --soft:#f6f6f6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d0d0d; --tx:#f2f2f2; --mut:#8c8c8c; --line:#232323; --soft:#171717; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Segoe UI",Tahoma,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
input,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

#app{max-width:560px;margin:0 auto;padding:0 20px 120px}

/* ---------- الترويسة ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(18px + env(safe-area-inset-top)) 0 18px;
}
header h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.2px}
header .sub{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--mut);font-size:15px;padding:6px 0}
.link:active{color:var(--tx)}
.hlinks{display:flex;gap:18px;align-items:center}

/* ---------- المساعد ---------- */
.ctx{color:var(--mut);font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:8px 13px;margin-bottom:4px}
.chat{display:flex;flex-direction:column;gap:12px;margin:18px 0 8px;min-height:40vh}
.m{max-width:88%;padding:11px 15px;border-radius:15px;font-size:15px;line-height:1.75;word-wrap:break-word}
.m.me{align-self:flex-start;background:var(--tx);color:var(--bg);border-bottom-right-radius:4px}
.m.ai{align-self:flex-end;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.pend{opacity:.55}
.m img{width:100%;max-width:210px;border-radius:9px;margin-bottom:7px;display:block}
.m .muted{font-size:12.5px;opacity:.8}
.imgnote{font-size:12px;opacity:.7;margin-bottom:4px}
.hintbox{color:var(--mut);font-size:14.5px;text-align:center;padding:34px 20px;line-height:1.9}
.typing{display:flex;gap:5px;align-items:center;padding:15px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.keyerr{color:var(--tx);font-size:13.5px;line-height:1.7;margin-top:10px;
  border-inline-start:2px solid var(--tx);padding-inline-start:12px}
.keyerr:empty{display:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;background:none;border:1px solid var(--line);border-radius:99px;
  padding:7px 14px;font-size:13px;color:var(--mut);white-space:nowrap}
.askbar{position:sticky;bottom:0;background:var(--bg);display:flex;gap:8px;align-items:center;
  padding:12px 0 calc(14px + env(safe-area-inset-bottom));margin-top:8px}
.askbar input[type=text]{flex:1;min-width:0;background:var(--soft);border:1px solid var(--line);
  border-radius:22px;padding:12px 17px;font-size:15px}
.askbar button{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:none;display:grid;place-items:center;color:var(--tx)}
.askbar button.send{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.steps{padding-inline-start:20px;line-height:2.1;font-size:15px}
.keyin{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;font-size:15px;direction:ltr;text-align:left;margin-top:6px}
.askbtn{margin-top:0;margin-bottom:22px}

/* ---------- الصفحة الرئيسية ---------- */
.lbl{color:var(--mut);font-size:13px;letter-spacing:.02em;margin:26px 0 10px}
.daylist{display:flex;flex-direction:column;gap:10px}
.day{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  width:100%;text-align:right;background:none;color:inherit;
  border:1px solid var(--line);border-radius:12px;padding:18px 18px;
}
.day:active{background:var(--soft)}
.day b{font-size:18px;font-weight:600}
.day span{color:var(--mut);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- التمرين ---------- */
.ex{padding:24px 0;border-bottom:1px solid var(--line)}
.ex:last-of-type{border-bottom:0}
.ex h2{font-size:18px;font-weight:600;margin:0 0 4px;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.ex h2 .en{color:var(--mut);font-size:13.5px;font-weight:400;letter-spacing:.01em;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.last{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;direction:rtl}
.last em{font-style:normal;margin-inline-end:10px}
.up{display:inline-block;color:var(--tx);border:1px solid var(--tx);border-radius:6px;
  padding:0 8px;font-size:12px;margin-inline-start:10px;vertical-align:1px}
.note{color:var(--mut);font-size:13.5px;margin-top:5px;padding-inline-start:13px;position:relative;line-height:1.5}
.note::before{content:'';position:absolute;right:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--mut)}
.noteinput{width:100%;margin-top:6px;background:var(--soft);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;font-size:14px}
.ssgroup{border-right:2px solid var(--tx);padding-right:16px;margin:6px 0}
.ssgroup .ex:last-of-type{border-bottom:0}
.sslabel{color:var(--mut);font-size:12px;padding-top:22px}
.head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.head > div{flex:1;min-width:0}
.thumb{width:56px;height:56px;flex:none;border:1px solid var(--line);border-radius:8px;
  object-fit:cover;background:var(--soft);padding:0}

/* ---------- صورة التمرين مكبّرة ---------- */
#photo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:none}
#photo.show{display:block}
#photo .in{max-width:560px;margin:0 auto;padding:0 20px calc(40px + env(safe-area-inset-bottom))}
#photo .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;background:var(--bg);padding:calc(18px + env(safe-area-inset-top)) 0 14px}
#photo h2{font-size:19px;font-weight:600;margin:0}
#photo .en{color:var(--mut);font-size:13px;direction:ltr;text-align:right}
#photo figure{margin:0 0 20px}
#photo img{width:100%;border:1px solid var(--line);border-radius:10px;display:block}
#photo figcaption{color:var(--mut);font-size:13px;margin-top:7px}

.heads{display:grid;grid-template-columns:18px 1fr 1fr 46px 26px;gap:8px;
  color:var(--mut);font-size:12px;text-align:center;margin-bottom:8px}
.set{display:grid;grid-template-columns:18px 1fr 1fr 46px 26px;gap:8px;align-items:center;margin-bottom:10px}
.del{background:none;border:0;color:var(--mut);opacity:.5;padding:0;display:grid;place-items:center;height:44px}
.del:active{opacity:1;color:var(--tx)}
.set.done{opacity:.4}
.set > .n{text-align:center;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.num{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.num button{flex:none;width:36px;background:none;border:0;color:var(--mut);font-size:20px;padding:11px 0;line-height:1}
.num button:active{background:var(--soft)}
.num input{flex:1;min-width:0;width:100%;background:none;border:0;text-align:center;
  font-size:17px;font-weight:600;padding:11px 0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num.flat{justify-content:center;color:var(--mut);font-size:14px;padding:11px 0}
.tick{height:46px;border:1px solid var(--line);border-radius:10px;background:none;font-size:17px;color:var(--mut)}
.tick.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.exfoot{margin-top:4px}
.exfoot button{background:none;border:0;color:var(--mut);font-size:14px;padding:6px 12px 6px 0}

/* ---------- أزرار ---------- */
.btn{display:block;width:100%;background:var(--tx);color:var(--bg);border:0;
  border-radius:12px;padding:17px;font-size:17px;font-weight:600;margin-top:28px}
.btn.quiet{background:none;color:var(--mut);border:1px solid var(--line);font-weight:400;margin-top:12px}
.btn:active{opacity:.75}

/* ---------- مؤقت الراحة ---------- */
#rest{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s ease;
  background:var(--bg);border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom))}
#rest.show{transform:none}
#rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:16px}
#rest .t{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;min-width:74px}
#rest .c{color:var(--mut);font-size:14px;flex:1}
#rest button{background:none;border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:15px;color:var(--mut)}
#track{height:2px;background:var(--line);margin-top:12px;max-width:560px;margin-inline:auto}
#track i{display:block;height:100%;background:var(--tx);transition:width 1s linear}

/* ---------- السجل ---------- */
.rec{border-bottom:1px solid var(--line);padding:16px 0}
.rec:last-child{border-bottom:0}
.recrow{display:flex;align-items:center;gap:10px}
.recmain{display:flex;flex:1;justify-content:space-between;align-items:baseline;gap:12px;
  background:none;border:0;color:inherit;text-align:right;padding:0}
.rec b{font-size:16px;font-weight:600}
.rec time{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.rec .body{margin-top:14px}
.rec .row{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--mut);font-size:14px;padding:2px 0}
.rec .row b{flex:1}
.rec .row .del{height:32px}
.rec .row b{color:var(--tx);font-weight:400;font-size:15px}
.rec .row span{font-variant-numeric:tabular-nums;direction:ltr;text-align:left}

.empty{color:var(--mut);padding:40px 0;text-align:center}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;color:var(--mut);font-size:14px}
.foot button{background:none;border:0;color:var(--mut);font-size:14px;padding:0}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;
  border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:10px}
.setting input{width:80px;background:none;border:1px solid var(--line);border-radius:9px;
  padding:8px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

#msg{position:fixed;left:50%;transform:translate(-50%,14px);bottom:100px;z-index:40;opacity:0;
  background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:10px;font-size:15px;
  transition:.2s;pointer-events:none;max-width:88vw;text-align:center}
#msg.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>

<div id="rest">
  <div class="in">
    <div class="t" id="restNum">0:00</div>
    <div class="c">راحة</div>
    <button onclick="restAdd(30)">+٣٠ ث</button>
    <button onclick="restSkip()">تخطّي</button>
  </div>
  <div id="track"><i></i></div>
</div>
<div id="photo" onclick="if(event.target.id==='photo')closePic()"></div>
<div id="msg"></div>

<script src="app.js"></script>
</body>
</html>
