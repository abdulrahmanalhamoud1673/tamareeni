name: تنبيهات تماريني

# ليش مش كرون عادي: جرّبنا "*/10 * * * *" و GitHub خنقه لمرة كل ساعتين لأربع
# ساعات — يعني تذكير الحصة كان بيضيع. فبدلها كل تشغيلة بتحجز اللي بعدها، واللي
# بعدها بتستنى ١٠ دقايق بـ environment فيه wait timer (استنى بلا ما يشتغل رَنَر).
# والكرون كل ساعة ضل موجود كاحتياطي بس، يرجّع السلسلة إذا انقطعت.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: "محجوزة من التشغيلة اللي قبلها (بتستنى ١٠ دقايق أول)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/notify.yml", "push/notify.js"]

permissions:
  contents: write
  actions: write

jobs:
  wait:
    if: ${{ inputs.chained }}
    runs-on: ubuntu-latest
    environment: every-10-min
    steps:
      - run: echo "مرّت ١٠ دقايق على آخر فحص"

  send:
    needs: wait
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: tamareeni-notify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # ابدأ من آخر حالة، مش من لقطة قديمة
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --no-save web-push@3
      - name: افحص وابعث
        run: node push/notify.js
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_STORE: ${{ secrets.PUSH_STORE }}
          PUSH_DEVICES: ${{ secrets.PUSH_DEVICES }}
      - name: احفظ شو انبعث
        run: |
          if [ -n "$(git status --porcelain push/state.json)" ]; then
            git config user.name "tamareeni-bot"
            git config user.email "tamareeni-bot@users.noreply.github.com"
            git add push/state.json
            git commit -q -m "تنبيهات: تذكّر شو انبعث"
            git pull -q --rebase -X theirs && git push -q
          fi
      - name: احجز التشغيلة الجاية
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # بلا wait timer السلسلة بتصير تشغيلات ورا بعض بلا وقفة — نوقف ونخلّيها للكرون
          wait=$(gh api "repos/$GITHUB_REPOSITORY/environments/every-10-min" \
                   --jq '[.protection_rules[]? | select(.type == "wait_timer") | .wait_timer][0] // 0' || echo 0)
          if [ "${wait:-0}" -lt 3 ]; then echo "ما في wait timer — بنسيبها للكرون"; exit 0; fi
          queued=$(gh run list -R "$GITHUB_REPOSITORY" -w notify.yml -L 20 --json databaseId,status \
                     --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status == \"waiting\" or .status == \"queued\" or .status == \"pending\" or .status == \"requested\")] | length")
          if [ "${queued:-0}" -gt 0 ]; then echo "في وحدة محجوزة أصلاً"; exit 0; fi
          for i in 1 2 3; do
            gh workflow run notify.yml -R "$GITHUB_REPOSITORY" -f chained=true && exit 0
            sleep 15
          done
          exit 1
