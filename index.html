<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>تماريني — مدرب الحديد</title>
<meta name="theme-color" content="#0b1016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تماريني">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0b1016; --bg2:#121a24; --card:#161f2b; --line:#243244;
  --tx:#e8eef6; --mut:#8b9bb0; --acc:#22c55e; --acc2:#16a34a; --danger:#ef4444;
  --r:16px; --sh:0 4px 20px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f4f6f9; --bg2:#ffffff; --card:#ffffff; --line:#e2e8f0;
  --tx:#0f172a; --mut:#64748b; --sh:0 2px 12px rgba(15,23,42,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:"Segoe UI","Tahoma",-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55; overscroll-behavior-y:none;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h2.h{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h3{margin:0 0 10px;font-size:19px}
.muted{color:var(--mut)} .sm{font-size:13px}
#view{padding:14px 14px 20px;max-width:640px;margin:0 auto}

/* ---------- شريط علوي ---------- */
#top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 70%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;justify-content:center}
#top .logo{font-weight:800;font-size:19px;letter-spacing:-.3px}
#top .logo span{color:var(--acc)}

/* ---------- شريط سفلي ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;
  background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.nb{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:12px;color:var(--mut);cursor:pointer;transition:.15s}
.nb span{font-size:21px;line-height:1}
.nb i{font-style:normal;font-size:11px;font-weight:600}
.nb.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}

/* ---------- أزرار ---------- */
.btn{background:var(--acc);color:#04140a;border:0;border-radius:14px;padding:14px 18px;font-weight:800;
  cursor:pointer;transition:.15s;box-shadow:var(--sh)}
.btn:active{transform:scale(.97)}
.btn.wide{display:block;width:100%;margin:10px 0}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.mini{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:9px;
  padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.mini.danger{color:var(--danger)}
.actrow{display:flex;gap:10px;margin:10px 0}
.actrow .btn{flex:1;margin:0}

/* ---------- البطل / المستوى ---------- */
.hero{background:linear-gradient(150deg,var(--card),color-mix(in srgb,var(--acc) 9%,var(--card)));
  border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.lvlrow{display:flex;gap:14px;align-items:center}
.lvlbadge{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04140a;font-weight:900;font-size:23px;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.lvltitle{font-weight:800;margin-bottom:5px}
.bar{height:9px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px;transition:.5s}
.bar.big{height:12px;margin:10px 0 6px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st{background:var(--bg);border-radius:13px;padding:10px 6px;text-align:center;border:1px solid var(--line)}
.st b{display:block;font-size:19px} .st i{font-style:normal;font-size:11.5px;color:var(--mut)}

.warn{background:color-mix(in srgb,#f59e0b 14%,var(--card));border:1px solid color-mix(in srgb,#f59e0b 40%,transparent);
  border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14.5px}

/* ---------- بطاقات الأيام ---------- */
.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.daycard{position:relative;text-align:right;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:15px 14px 13px;cursor:pointer;overflow:hidden;transition:.15s;color:inherit}
.daycard:active{transform:scale(.975)}
.daycard::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.daycard.suggest{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 28%,transparent)}
.pill{position:absolute;top:9px;left:9px;background:var(--c);color:#fff;font-size:10px;font-weight:800;
  padding:3px 8px;border-radius:99px}
.dic{font-size:27px;line-height:1}
.dname{font-weight:800;margin-top:6px;font-size:16px}
.dsub{font-size:12px;color:var(--mut);margin-top:2px}
.dago{font-size:11.5px;color:var(--c);margin-top:6px;font-weight:700}

/* ---------- الجلسة النشطة ---------- */
.sess{background:linear-gradient(150deg,var(--card),color-mix(in srgb,var(--c) 12%,var(--card)));
  border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;
  position:sticky;top:calc(48px + env(safe-area-inset-top));z-index:30;box-shadow:var(--sh)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sname{font-weight:800;font-size:17px}
.srow2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}

/* ---------- بطاقة التمرين ---------- */
.ssgroup{border:2px dashed color-mix(in srgb,var(--acc) 45%,transparent);border-radius:18px;padding:8px;margin-bottom:11px;
  background:color-mix(in srgb,var(--acc) 4%,transparent)}
.sslabel{font-size:12px;font-weight:800;color:var(--acc);padding:2px 6px 8px}
.ssgroup .excard{margin-bottom:8px} .ssgroup .excard:last-child{margin-bottom:0}
.excard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:11px;overflow:hidden}
.excard.complete{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.exhead{display:flex;align-items:center;gap:11px;padding:13px 13px;cursor:pointer}
.exicon{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:color-mix(in srgb,var(--m) 16%,transparent);border:1px solid color-mix(in srgb,var(--m) 35%,transparent)}
.exmain{flex:1;min-width:0}
.exname{font-weight:800;font-size:15.5px}
.exsub{font-size:12px;color:var(--mut)}
.exarrow{color:var(--mut);font-size:12px}
.excard.complete .exicon{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.exbody{padding:0 13px 13px;border-top:1px solid var(--line)}
.redflag{font-size:12px}
.flagbox{background:color-mix(in srgb,var(--danger) 13%,transparent);border-radius:11px;padding:8px 11px;
  font-size:13px;margin:11px 0;font-weight:700}
.lastbox{background:var(--bg);border-radius:12px;padding:9px 12px;margin:11px 0 8px;border:1px solid var(--line)}
.lb-t{font-size:11px;color:var(--mut);font-weight:700}
.lb-v{font-size:14.5px;font-weight:700;direction:rtl}
.sugbox{background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);
  border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sugbox .mini{margin-inline-start:auto;background:var(--acc);color:#04140a;border:0}
.tipbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:10px 0;font-size:14px}

.setheads{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:7px;font-size:11px;color:var(--mut);
  text-align:center;margin-bottom:5px;font-weight:700}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:7px;align-items:center;margin-bottom:7px}
.setrow.ok{opacity:.62}
.sn{text-align:center;font-size:12.5px;color:var(--mut);font-weight:800}
.bwlbl{text-align:center;font-size:12px;color:var(--mut);background:var(--bg);border-radius:11px;padding:12px 2px;border:1px solid var(--line)}
.stepper{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{flex:none;width:38px;background:none;border:0;font-size:20px;font-weight:700;color:var(--mut);cursor:pointer;padding:9px 0}
.stepper button:active{background:var(--line)}
.stepper input{flex:1;min-width:0;width:100%;background:none;border:0;text-align:center;font-weight:800;font-size:16px;
  padding:9px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{width:48px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line);
  color:var(--mut);font-size:19px;font-weight:900;cursor:pointer;transition:.15s}
.chk.on{background:var(--acc);color:#04140a;border-color:var(--acc)}
.chk:active{transform:scale(.92)}
.exfoot{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}

/* ---------- مؤقت الراحة ---------- */
#rest{position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px)}
#rest.show{display:grid}
.restbox{text-align:center}
.restring{width:210px;height:210px;transform:rotate(-90deg)}
.restring circle{fill:none;stroke-width:9;stroke-linecap:round}
.restring .bgc{stroke:var(--line)}
.restring .fg{stroke:var(--acc);stroke-dasharray:283;transition:stroke-dashoffset 1s linear}
#restNum{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:900;letter-spacing:-1px}
.restwrap{position:relative;display:inline-block}
.restlbl{color:var(--mut);font-weight:700;margin-bottom:6px}
.restbtns{display:flex;gap:9px;justify-content:center;margin-top:18px}

/* ---------- التقدم ---------- */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 8px;text-align:center}
.card b{display:block;font-size:19px} .card i{font-style:normal;font-size:11.5px;color:var(--mut)}
.card small{display:block;font-size:10px;color:var(--mut);margin-top:3px}
.mbars{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}
.mrow{display:grid;grid-template-columns:88px 1fr 46px;gap:9px;align-items:center;margin-bottom:9px}
.mrow:last-child{margin-bottom:0}
.mlbl{font-size:13px;font-weight:700}
.mtrack{height:11px;background:var(--bg);border-radius:99px;overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:99px;transition:.6s}
.mval{font-size:11.5px;color:var(--mut);text-align:left;font-weight:700}
.mval.bad{color:var(--danger)}
.sel{width:100%;padding:12px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}
.chart{margin-bottom:12px}
.clbl{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:3px}
.chart svg{width:100%;height:110px;display:block}
.crange{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);direction:ltr}
.chstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:11px}
.chstats div{text-align:center}
.chstats b{display:block;font-size:17px} .chstats i{font-style:normal;font-size:10.5px;color:var(--mut)}
.chstats .up b{color:var(--acc)} .chstats .down b{color:var(--danger)}
.prlist{display:flex;flex-direction:column;gap:8px}
.pr{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;
  display:grid;grid-template-columns:1fr auto;gap:2px}
.pr span{font-weight:700} .pr b{font-size:17px;color:var(--acc)}
.pr small{grid-column:1/-1;font-size:11px;color:var(--mut)}

/* ---------- السجل ---------- */
.calhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.calnames{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--mut);text-align:center;margin-bottom:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cday{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:13px;color:var(--mut);
  background:var(--card);border:1px solid transparent}
.cday.has{background:color-mix(in srgb,var(--dc) 28%,var(--card));color:var(--tx);font-weight:800;cursor:pointer;border-color:var(--dc)}
.cday.today{outline:2px solid var(--acc);outline-offset:-2px}
.hlist{display:flex;flex-direction:column;gap:8px}
.hitem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-right:4px solid var(--c);border-radius:14px;padding:11px 13px;text-align:right;cursor:pointer;color:inherit}
.hic{font-size:21px}
.hmain{flex:1} .hmain b{display:block;font-size:14.5px} .hmain i{font-style:normal;font-size:11.5px;color:var(--mut)}
.hstat{font-size:12px;color:var(--mut);text-align:left;font-weight:700}
.deta{max-height:44vh;overflow:auto;margin:11px 0}
.detrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.detrow span{color:var(--mut);direction:ltr;font-size:13px}

/* ---------- الجسم ---------- */
.bodygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bfield{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:10px 12px}
.bfield span{font-size:12px;color:var(--mut);font-weight:700}
.bfield i{font-style:normal;font-size:10px;opacity:.7}
.bfield input{background:none;border:0;font-size:19px;font-weight:800;width:100%;padding:0;-moz-appearance:textfield}
.bfield input::-webkit-outer-spin-button,.bfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{margin:0;background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;cursor:pointer}
.ph figcaption{font-size:10px;color:var(--mut);padding:5px 7px;display:flex;justify-content:space-between;align-items:center}
.ph figcaption button{background:none;border:0;color:var(--danger);font-size:13px;cursor:pointer;padding:0 3px}
.bigimg{width:100%;border-radius:13px;margin-bottom:10px}
.cmpstrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}
.cmpstrip img{height:74px;border-radius:9px;cursor:pointer;border:2px solid var(--line)}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp2 img{width:100%;border-radius:11px}
.cmp2 figcaption{font-size:11px;color:var(--mut);text-align:center;margin-top:4px}
.cmp2 figure{margin:0}
.setlist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srowi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.srowi:last-child{border:0}
.srowi input[type=number]{width:74px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center;font-weight:800}
.srowi input[type=checkbox]{width:46px;height:27px;appearance:none;background:var(--bg);border:1px solid var(--line);
  border-radius:99px;position:relative;cursor:pointer;transition:.2s}
.srowi input[type=checkbox]::after{content:'';position:absolute;top:2px;right:2px;width:21px;height:21px;border-radius:50%;
  background:var(--mut);transition:.2s}
.srowi input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
.srowi input[type=checkbox]:checked::after{right:calc(100% - 23px);background:#fff}

/* ---------- المدرب ---------- */
.setup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}
.steps{padding-inline-start:20px;font-size:14.5px;line-height:2}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.qb{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 8px;font-size:13.5px;
  font-weight:700;cursor:pointer;color:inherit}
.chat{display:flex;flex-direction:column;gap:9px;min-height:180px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:11px 14px;border-radius:17px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-start;background:var(--acc);color:#04140a;border-bottom-right-radius:5px;font-weight:600}
.msg.model{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.askbar{display:flex;gap:7px;align-items:center;margin-top:11px}
.askbar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:13px 17px}
.askbar .send,.askbar .mic{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--acc);
  color:#04140a;font-size:18px;font-weight:800;cursor:pointer}
.askbar .mic{background:var(--card);border:1px solid var(--line);color:var(--tx)}

/* ---------- عام ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--mut);font-size:44px}
.empty p{font-size:15px;margin:14px 0 20px;line-height:1.8}
.search{width:100%;padding:13px 15px;border-radius:13px;background:var(--bg);border:1px solid var(--line);margin-bottom:11px}
.picklist{max-height:56vh;overflow-y:auto}
.ptitle{font-size:12.5px;color:var(--mut);font-weight:800;padding:9px 3px 5px;position:sticky;top:0;background:var(--card)}
.pitem{display:block;width:100%;text-align:right;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:6px;cursor:pointer;font-size:14.5px;color:inherit}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.sumgrid div{background:var(--bg);border-radius:13px;padding:12px 5px;text-align:center}
.sumgrid b{display:block;font-size:21px;color:var(--acc)} .sumgrid i{font-style:normal;font-size:11px;color:var(--mut)}
.fun{text-align:center;font-weight:700;font-size:15px}

#modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
#modal.show{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 17px calc(22px + env(safe-area-inset-bottom));
  width:100%;max-width:640px;max-height:88vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));right:50%;transform:translate(50%,20px);
  background:var(--tx);color:var(--bg);padding:11px 19px;border-radius:99px;font-size:14px;font-weight:700;
  z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translate(50%,0)}
.conf{position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:fall 2.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg);opacity:0}}
</style>
</head>
<body>
<div id="top"><div class="logo">💪 تمارين<span>ي</span></div></div>
<main id="view"></main>
<nav id="nav"></nav>

<div id="rest" onclick="if(event.target.id==='rest')restSkip()">
  <div class="restbox">
    <div class="restlbl">وقت الراحة</div>
